name: CI/CD

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop 
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build production Docker image
        run: docker build --target runner --tag stas-cakes-shop:ci .

      - name: Smoke-test production image
        run: 
          docker run --detach --rm \
            --name stas-cakes-shop-ci \
            --publish 3000:3000 \
            --env DATABASE_URL='postgresql://ci:ci@database.example.invalid:5432/stas_cakes_shop?sslmode=verify-full' \
            --env ADMIN_PASSWORD_HASH='scrypt:AAAAAAAAAAAAAAAAAAAAAA:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' \
            --env ADMIN_TOTP_SECRET='JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP' \
            --env RATE_LIMIT_SECRET='ci-only-rate-limit-secret-with-at-least-32-bytes' \
            --env PII_ENCRYPTION_KEY='AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE' \
            --env TRUSTED_PROXY_IP_HEADER='x-real-ip' \
            stas-cakes-shop:ci

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/live; then
              docker stop stas-cakes-shop-ci
              exit 0
            fi
            sleep 1
          done

          docker logs stas-cakes-shop-ci
          docker stop stas-cakes-shop-ci
          exit 1

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Coolify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request GET "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
