services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: release
    command:
      - sh
      - -c
      - npm run db:migrate:deploy
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/coolify-ca.crt
    volumes:
      - /data/coolify/ssl/coolify-ca.crt:/etc/ssl/certs/coolify-ca.crt:ro
    restart: "no"
    exclude_from_hc: true
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:?}
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:?}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?}
      TRUSTED_PROXY_IP_HEADER: ${TRUSTED_PROXY_IP_HEADER:-x-real-ip}
      ORDER_RETENTION_DAYS: ${ORDER_RETENTION_DAYS:-365}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/coolify-ca.crt
    volumes:
      - /data/coolify/ssl/coolify-ca.crt:/etc/ssl/certs/coolify-ca.crt:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,uid=1001,gid=1001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
