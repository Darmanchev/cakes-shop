<svg width="100%" height="100%" viewBox="0 0 1000 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="roughEdge" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08 0.4" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="40" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  
  <!-- The main distorted block -->
  <rect x="-50" y="30" width="1100" height="60" fill="#9c7371" filter="url(#roughEdge)" />
  
  <!-- A solid block underneath to guarantee no gaps at the bottom edge -->
  <rect x="-50" y="45" width="1100" height="30" fill="#9c7371" />
</svg>
